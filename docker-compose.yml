# Dokploy (service "Compose", Compose Path ./docker-compose.yml).
# Environment: ADMIN_TOKEN=... (required), SAYAD_DOMAIN=... (optional).
# The Traefik labels below publish the API on SAYAD_DOMAIN with HTTPS, so it
# works even when no domain is added in Dokploy's "Domains" tab.
services:
  sayad-api:
    build:
      context: ./server
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      ADMIN_TOKEN: ${ADMIN_TOKEN:?Set ADMIN_TOKEN in Dokploy environment}
      SAYAD_DB: /data/sayad.db
      OLD_APP_DIR: /data/old_app
      MEDIA_DIR: /data/media
    volumes:
      - sayad-data:/data
    expose:
      - "8100"
    networks:
      - dokploy-network
    labels:
      - traefik.enable=true
      - traefik.docker.network=dokploy-network
      # HTTPS
      - traefik.http.routers.sayad-api.rule=Host(`${SAYAD_DOMAIN:-sayad.digitlab.dev}`)
      - traefik.http.routers.sayad-api.entrypoints=websecure
      - traefik.http.routers.sayad-api.tls=true
      - traefik.http.routers.sayad-api.tls.certresolver=letsencrypt
      - traefik.http.routers.sayad-api.service=sayad-api
      - traefik.http.services.sayad-api.loadbalancer.server.port=8100
      # HTTP -> HTTPS
      - traefik.http.routers.sayad-api-http.rule=Host(`${SAYAD_DOMAIN:-sayad.digitlab.dev}`)
      - traefik.http.routers.sayad-api-http.entrypoints=web
      - traefik.http.routers.sayad-api-http.middlewares=sayad-https
      - traefik.http.middlewares.sayad-https.redirectscheme.scheme=https

volumes:
  sayad-data:

networks:
  dokploy-network:
    external: true
