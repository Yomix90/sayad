# Dokploy: create a "Compose" service pointing to this repository with
# Compose path = ./server/docker-compose.yml, set ADMIN_USER and ADMIN_PASSWORD in Environment,
# then add your domain on the "sayad-api" service, port 8100.
services:
  sayad-api:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      # Login of /admin: user name and password.
      ADMIN_USER: ${ADMIN_USER:-}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
      # Optional token for scripts (X-Admin-Token header).
      ADMIN_TOKEN: ${ADMIN_TOKEN:-}
      SAYAD_DB: /data/sayad.db
      OLD_APP_DIR: /data/old_app
      MEDIA_DIR: /data/media
    volumes:
      - sayad-data:/data
    expose:
      - "8100"

volumes:
  sayad-data:
